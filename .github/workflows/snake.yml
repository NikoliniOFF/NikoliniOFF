name: Змейка

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#e0f2fe,#bae6fd,#7dd3fc,#38bdf8,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67e8f9&color_dots=#0f1a3d,#1e3a8a,#2563eb,#38bdf8,#67e8f9&color_background=#0a0f2c

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
